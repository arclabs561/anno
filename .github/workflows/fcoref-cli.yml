name: FCoref CLI with real weights

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fcoref-cli.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/anno/Cargo.toml'
      - 'crates/anno-cli/Cargo.toml'
      - 'crates/anno/src/backends/coref/fcoref/**'
      - 'crates/anno/tests/fcoref_word_budget.rs'
      - 'crates/anno/tests/fixtures/fcoref_word_budget.json'
      - 'crates/anno/src/core/grounded/**'
      - 'crates/anno-cli/src/cli/commands/pipeline.rs'
      - 'crates/anno-cli/src/cli/utils.rs'
      - 'crates/anno-cli/tests/pipeline_coref_backend.rs'
      - 'scripts/export_fcoref.py'
      - 'scripts/qa/fcoref_cgroup/**'
      - 'crates/anno/examples/fcoref_resource_profile.rs'

permissions:
  contents: read

concurrency:
  group: fcoref-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODEL_REVISION: e91dfff12879495d882ba9460d0c5d5dd44ade59
      FCOREF_MODEL_PATH: ${{ github.workspace }}/fcoref_onnx
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache converted model
        id: weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FCOREF_MODEL_PATH }}
          key: fcoref-fp32-${{ runner.os }}-${{ runner.arch }}-${{ env.MODEL_REVISION }}-${{ hashFiles('scripts/export_fcoref.py', '.github/workflows/fcoref-cli.yml') }}
      - if: steps.weights.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Export the pinned CPU model
        if: steps.weights.outputs.cache-hit != 'true'
        run: |
          python -m pip install 'torch @ https://download.pytorch.org/whl/cpu/torch-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl' \
            'transformers==4.51.3' 'tokenizers==0.21.4' 'onnx==1.17.0' 'onnxruntime==1.24.2' 'safetensors==0.8.0'
          checkpoint=$(python -c 'import os; from huggingface_hub import hf_hub_download; print(hf_hub_download("biu-nlp/f-coref", "pytorch_model.bin", revision=os.environ["MODEL_REVISION"]))')
          echo "30ea6efe2bce49a857fe8aba41dcfe28b4147f77e3dec9f14100950bf4de1aa5  $checkpoint" | sha256sum -c -
          python scripts/export_fcoref.py --revision "$MODEL_REVISION" --output-dir "$FCOREF_MODEL_PATH"
      - name: Verify converted artifacts
        working-directory: ${{ env.FCOREF_MODEL_PATH }}
        run: |
          sha256sum -c <<'SUMS'
          74b98b0f03b27154065d0918a566ed5968d14665e601ecaea6905014bfe6f065  encoder.onnx
          54c3e13017825750b725dbb682db861c3b7933db6ec1306ff5f51d46c533d0e7  scorer_weights.safetensors
          5ec67f22fb423648c32c22819353703e5d3dddd3a553b11989f37702fb910aa1  tokenizer.json
          12361347b196a78de4fad99045cd127c19baa55590fc7885f84a89a7a785bfbf  config.json
          SUMS
      - name: Run the FCoref model contracts
        env:
          ANNO_NO_DOWNLOADS: '1'
        run: cargo test --locked -p anno --no-default-features --features onnx --lib fcoref -- --ignored --test-threads=1
      - name: Check word-aligned mention scores against the pinned reference
        env:
          ANNO_NO_DOWNLOADS: '1'
          FCOREF_MODEL_DIR: ${{ env.FCOREF_MODEL_PATH }}
        run: >-
          cargo test --locked -p anno --no-default-features --features onnx
          --test fcoref_word_budget -- --ignored
      - name: Check neural and fallback output through the CLI
        env:
          ANNO_NO_DOWNLOADS: '1'
        run: >-
          cargo test --locked -p anno-cli --no-default-features --features onnx,extractor-html2text
          --test pipeline_coref_backend -- --include-ignored
      - name: Build the release-profile FCoref benchmark
        run: |
          python3 -m unittest discover -s scripts/qa/fcoref_cgroup
          cargo build --locked --release -p anno --no-default-features --features onnx,ort/load-dynamic --example fcoref_resource_profile
      - name: Replay the FP32 boundary matrix with one CPU and 2 GiB
        env:
          RUNTIME_IMAGE: ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289
        run: |
          wheel_dir=$(mktemp -d)
          python3 -m pip download --no-deps --only-binary=:all: --platform manylinux_2_27_x86_64 --implementation cp --python-version 3.12 --abi cp312 -d "$wheel_dir" 'onnxruntime==1.24.4'
          wheel=$(find "$wheel_dir" -name '*.whl')
          echo "0d640eb9f3782689b55cfa715094474cd5662f2f137be6a6f847a594b6e9705c  $wheel" | sha256sum -c -
          ort="$wheel_dir/libonnxruntime.so.1.24.4"
          unzip -p "$wheel" 'onnxruntime/capi/libonnxruntime.so.1.24.4' > "$ort"
          docker pull "$RUNTIME_IMAGE"
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          python3 scripts/qa/fcoref_cgroup/replay.py \
            --binary target/release/examples/fcoref_resource_profile --model "$FCOREF_MODEL_PATH" \
            --ort "$ort" --image "$RUNTIME_IMAGE" --cpu "$cpu" --output fcoref-cgroup.json
      - name: Upload the container resource receipt
        if: always() && hashFiles('fcoref-cgroup.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fcoref-cgroup
          path: fcoref-cgroup.json
