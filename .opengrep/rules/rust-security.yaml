# OpenGrep custom rules for anno codebase
# These rules complement clippy by focusing on security and reliability patterns

rules:
  # ============================================================================
  # Error Handling Anti-patterns
  # ============================================================================
  
  - id: dangerous-unwrap-in-library
    pattern: $VAR.unwrap()
    message: "Unwrap in library code - potential panic. Consider expect() with context or proper error handling."
    languages: [rust]
    severity: WARNING
    metadata:
      category: reliability
      cwe: "CWE-248: Uncaught Exception"
    paths:
      exclude:
        - "**/tests/**"
        - "**/examples/**"
        - "**/benches/**"
        - "**/hack/**"

  - id: expect-without-context
    pattern: $VAR.expect($MSG)
    message: "Expect without descriptive message. Add context about what failed."
    languages: [rust]
    severity: INFO
    metadata:
      category: maintainability
    paths:
      exclude:
        - "**/tests/**"

  - id: panic-in-library
    patterns:
      - pattern: panic!(...)
      # Skip brace-balanced test items before looking for a panic macro.
      - pattern-regex: |-
          (?mx)
          (?(DEFINE)(?<body> \{ (?: [^{}]++ | (?&body) )* \} ))
          ^\h*\#\[(?:cfg\(test\)|test)\]\s*
          (?:\#\[[^\]\n]+\]\s*)* [^;{}]++ (?&body) (*SKIP)(*F)
          | \bpanic\h*!
    message: "Panic in library code. Libraries should return Result types instead of panicking."
    languages: [rust]
    severity: ERROR
    metadata:
      category: reliability
    paths:
      exclude:
        - "**/tests/**"
        - "**/tests.rs"
        - "**/examples/**"

  # ============================================================================
  # Unsafe Code Patterns
  # ============================================================================
  
  - id: unsafe-block-without-comment
    patterns:
      - pattern: unsafe { ... }
      # Rust AST patterns discard comments. Skip a documented block's opening
      # token, then intersect the remaining unsafe tokens with actual blocks.
      - pattern-regex: |-
          (?mx)
          ^\h*//\h*SAFETY:[^\n]*\n (?:\h*//[^\n]*\n)* (?:[^\n{};]*=\h*\n)? [^\n{};]*\bunsafe\s*\{ (*SKIP)(*F)
          | \bunsafe\s*\{
    message: "Unsafe block without safety comment. Document why this is safe."
    languages: [rust]
    severity: WARNING
    metadata:
      category: safety

  - id: unsafe-function-without-docs
    patterns:
      - pattern: unsafe fn $F(...) { ... }
      - pattern-regex: |-
          (?mx)
          ^\h*///[^\n]*\n (?:\h*\#\[[^\n]*\]\h*\n)* \h*
          (?:pub(?:\([^)]*\))?\h+)?unsafe\h+fn\b (*SKIP)(*F)
          | \bunsafe\h+fn\b
    message: "Unsafe function without documentation. Document safety requirements."
    languages: [rust]
    severity: WARNING
    metadata:
      category: safety

  # ============================================================================
  # Concurrency Patterns
  # ============================================================================
  
  - id: mutex-lock-without-handling-poison
    patterns:
      - pattern: |
          let $VAR = $MUTEX.lock();
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          $VAR.unwrap_or_else(...)
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          $VAR.map_err(...)
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          match $VAR { $P => $A, $Q => $B }
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          if let Ok($VALUE) = $VAR { ... }
    message: "Mutex lock without poison handling. Consider unwrap_or_else or proper error handling."
    languages: [rust]
    severity: WARNING
    metadata:
      category: reliability
    paths:
      include:
        - "**/eval/**"
        - "**/sync.rs"
        - "**/session_pool.rs"

  # ============================================================================
  # Memory Safety
  # ============================================================================
  
  - id: unchecked-array-access
    patterns:
      - pattern: $ARR[$INDEX]
      - pattern-not-inside: |
          if $INDEX < $ARR.len() { ... }
    message: "Unchecked array access. Consider using get() or bounds checking."
    languages: [rust]
    severity: WARNING
    metadata:
      category: safety
    paths:
      exclude:
        - "**/tests/**"

  # ============================================================================
  # API Design
  # ============================================================================
  
  - id: public-unsafe-function
    patterns:
      - pattern: unsafe fn $F(...) { ... }
      - pattern-regex: '\bpub\s+\Kunsafe\s+fn\b'
    message: "Public unsafe function. Ensure it's necessary and well-documented."
    languages: [rust]
    severity: INFO
    metadata:
      category: api-design

  # ============================================================================
  # Evaluation-Specific Patterns
  # ============================================================================
  
  - id: division-without-zero-check
    patterns:
      - pattern: $NUM / $DENOM
      - pattern-not-inside: |
          if $DENOM != 0 { ... }
      - pattern-not-inside: |
          if $DENOM == 0 { return Err(...); }
          ...
    message: "Division without zero check. Could panic on zero denominator."
    languages: [rust]
    severity: WARNING
    metadata:
      category: reliability
    paths:
      include:
        - "**/eval/**"
        - "**/metrics.rs"

