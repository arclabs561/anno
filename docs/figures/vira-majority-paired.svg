<text x="18" y="110" class="scope">Candidate · Fastino classifier</text>
<text x="18" y="130" class="scope">Net exact matches · −13 to +13 · center is zero</text>
<path d="M18 150H502" stroke="#bdcec9"/>
<text x="18" y="175" class="cohort">Held-out test</text>
<text x="18" y="199" class="scope">8 Fastino abstentions · 72 dialogue turns</text>
