[package]
name = "anno-py"
# Independent version: wheels ship to PyPI via maturin, not crates.io.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for anno"
# Not published to crates.io: the artifact is a PyPI wheel built by maturin.
# (The path dep on `anno` has no version, which also blocks cargo publish.)
publish = false

[lib]
name = "anno_py"
crate-type = ["cdylib"]
# Keep the focused binding-conversion regression tests enabled. They exercise
# feature-independent error handling without loading a model; Python tests
# cover the extension boundary separately.
test = true
doctest = false

[dependencies]
# abi3-py39: one wheel per platform covers Python 3.9+.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# default-features = false drops `onnx` (ort C++ runtime + model downloads).
# The Python binding explicitly assembles RegexNER + HeuristicNER for its
# offline API, including when the optional `onnx` feature is enabled.
# `heuristic-fr` is pattern-based (no models, no deps), kept to match the
# crate's default set minus onnx.
anno = { path = "../anno", default-features = false, features = ["heuristic-fr"] }

[features]
default = []
# Enabled by maturin (see pyproject.toml). Off by default so
# `cargo check -p anno-py` and `cargo test` link normally.
extension-module = ["pyo3/extension-module"]
# Opt-in model-backed extractors. Keep the wheel default offline: ONNX Runtime
# and model retrieval are only included when a caller builds with this feature.
onnx = ["anno/onnx"]
# Opt-in source-build support for the experimental fastino GLiNER2 ONNX
# runtime. It is intentionally absent from the standard wheel because the
# runtime fetches model assets on first use and has not received a platform
# distribution decision yet.
fastino = ["anno/gliner2-fastino"]

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "fastino_reference"
required-features = ["fastino"]

[lints]
workspace = true
