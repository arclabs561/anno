name: python-wheels

# Builds anno-py wheels (abi3-py39: one wheel per platform, Python 3.9+).
# Publishes to PyPI via trusted publishing when dispatched with
# publish=publish or on an anno-py-v* tag.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Type 'publish' to upload to PyPI"
        required: false
        default: ""
  push:
    tags:
      - "anno-py-v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform.runner }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
          - { runner: macos-15, target: aarch64 }
          # No macos-13 (Intel) wheel: GitHub's free Intel-mac runners are
          # being deprecated and the job sits queued indefinitely. Apple
          # Silicon is covered by macos-15; Intel-mac users build from the
          # sdist. Re-add if there's demand for a prebuilt x86_64 mac wheel.
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/anno-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - name: smoke test wheel
        if: matrix.platform.runner == 'ubuntu-latest'
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet pytest
          /tmp/smoke/bin/pip install --no-index --no-deps crates/anno-py/dist/*.whl
          sha256sum crates/anno-py/dist/*.whl >> "$GITHUB_STEP_SUMMARY"
          /tmp/smoke/bin/pytest crates/anno-py/tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: crates/anno-py/dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/anno-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: crates/anno-py/dist
          if-no-files-found: error

  verify-distributions:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: ${{ runner.temp }}/dist
      - name: Verify all supported wheels and the source distribution
        run: >-
          python3 crates/anno-py/tests/verify_pypi.py --inventory-only
          --release-dir "$RUNNER_TEMP/dist" --receipt "$RUNNER_TEMP/inventory.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-release-inventory
          path: ${{ runner.temp }}/inventory.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/anno-py-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'publish' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/anno-py-v')))
    needs: verify-distributions
    runs-on: ubuntu-latest
    # PyPI trusted publisher is configured against this environment name.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # A version tag pushed after a dispatch-publish triggers a second
          # run over the same artifacts; treat re-uploads as a no-op.
          skip-existing: true

  # PyPI can accept a skipped upload; verify that every filename serves our bytes.
  verify-published:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/python-package-check.yml
    with:
      verify_release: true
