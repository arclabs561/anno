<svg xmlns="http://www.w3.org/2000/svg" width="984" height="754" viewBox="0 0 984 754" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">How much do extra CrossRE relation suggestions recover?</title><desc id="chart-desc">Correct matches and unmatched predictions per 100 sentences. Each panel shares the correct and unmatched rate axes. The numbered points identify the exact counts and recall in its table. Identical counts share a point. Development · six domains has 96 sentences and 397 gold items. Stock has 129 correct, 297 unmatched, and 32.5% recall. Confidence has 142 correct, 364 unmatched, and 35.8% recall. Both margins has 141 correct, 365 unmatched, and 35.5% recall. All above 0.40 has 148 correct, 431 unmatched, and 37.3% recall. Held-out test · six domains has 192 sentences and 646 gold items. Stock has 211 correct, 526 unmatched, and 32.7% recall. Confidence has 231 correct, 666 unmatched, and 35.8% recall. Both margins has 235 correct, 662 unmatched, and 36.4% recall. All above 0.40 has 234 correct, 732 unmatched, and 36.2% recall.</desc>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#183541;font-size:13px}.heading{font-size:24px;font-weight:700}.subtitle{font-size:15px;fill:#456371}.cohort{font-size:19px;font-weight:700}.scope,.axis{fill:#456371}.small,.axis{font-size:11px}.col{font-weight:700;font-size:12px}.num{text-anchor:end;font-variant-numeric:tabular-nums}.key{font-size:12px;font-weight:700;fill:#006867}.plot-key{paint-order:stroke;stroke:white;stroke-width:2;stroke-linejoin:round}.rule,.grid{fill:none;stroke:#d5e0e2;stroke-width:1}.frontier{fill:none;stroke:#6da8a2;stroke-width:1.6}.optimal{fill:#006867;stroke:white;stroke-width:1.2}.dominated{fill:white;stroke:#456371;stroke-width:1.5}.leader{stroke:#658384;stroke-width:.8}</style>
