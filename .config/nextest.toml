# Nextest configuration for anno
# See: https://nexte.st/book/configuration.html

[store]
dir = "target/nextest"

[test-groups]
model-initialization = { max-threads = 2 }

# =============================================================================
# Default Profile
# =============================================================================

[profile.default]
# Retry flaky tests once (not timeouts -- those are real failures)
retries = 1

# Mark tests as slow after 60s, terminate after 120s.
# Integration tests share one binary now (no per-file link overhead).
slow-timeout = { period = "60s", terminate-after = 2 }

# Fail fast on first failure in CI
fail-fast = false

# Status level for output
status-level = "pass"

# =============================================================================
# CI Profile - stricter timeouts
# =============================================================================

[profile.ci]
# Avoid re-running expensive timeouts: if it times out once, it almost always
# times out again (and retries multiply CI energy/time).
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = true
status-level = "all"

# =============================================================================
# Quick Profile - fast tests only
# =============================================================================

[profile.quick]
retries = 0
slow-timeout = { period = "10s", terminate-after = 1 }

# Filter out slow tests: property/proptest-heavy suites and large eval harness tests.
#
# Note: `test(/.../)` matches the test name. If you need to exclude whole integration-test
# binaries, prefer updating this filter with the actual `binary(...)` names from
# `cargo nextest list --workspace`.
default-filter = "not test(/property/) and not test(/proptest/) and not test(/eval::/) and not test(/eval.*harness/) and not test(/backend_availability_matrix/) and not test(/albert::tests::test_albert_name/) and not test(/randomized_matrix_sample/)"

# These tests construct real default models or traverse the document fixture.
# Keep them in the quick gate, but avoid concurrent model-loading contention and
# allow the normal 120-second budget (the fixture alone takes about 30 seconds).
[[profile.quick.overrides]]
filter = 'package(anno) and (test(annotated::tests::) or test(batch_tests::) or test(convenience_tests::) or test(backends::tplinker::tests::) or test(test_default_includes_ml_backend_when_available) or test(test_strategy_default_is_priority) or test(fixture_documents_structure_and_min_counts) or test(enrich_findings::all_backends_))'
test-group = 'model-initialization'
slow-timeout = { period = "60s", terminate-after = 2 }

# These metadata tests instantiate production defaults, which may load cached ONNX models.
# Keep their assertions in quick coverage while applying the existing initialized-model budget.
[[profile.quick.overrides]]
filter = 'package(anno) and test(=backends::ensemble::tests::test_new_backend_ids_have_weights)'
test-group = 'model-initialization'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.quick.overrides]]
filter = 'package(anno-cli) and test(=cli::parser::tests::test_stacked_default_has_ml_backend_when_available)'
test-group = 'model-initialization'
slow-timeout = { period = "60s", terminate-after = 2 }

# =============================================================================
# Coverage Profile
# =============================================================================

# LLVM instrumentation makes model-backed extraction tests slower. Coverage
# intentionally runs the full nonignored suite for its selected workspace and
# feature set, with a bounded per-test budget and concurrency.
[profile.coverage]
retries = 0
default-filter = "all()"
slow-timeout = { period = "60s", terminate-after = 2 }
test-threads = 2

# =============================================================================
# ML Profile - for ML backend tests
# =============================================================================

[profile.ml]
# ML tests are slow due to model loading
retries = 1
slow-timeout = { period = "180s", terminate-after = 3 }

# Limit parallelism to avoid OOM with multiple models
test-threads = 2

# =============================================================================
# Property Test Profile
# =============================================================================

[profile.property]
retries = 0
slow-timeout = { period = "120s", terminate-after = 2 }
test-threads = 4

# Only run property/fuzz tests
default-filter = "test(/property/) or test(/fuzz/) or test(/proptest/)"
