name: Dataset figures

on:
  pull_request:
    paths:
      - .github/workflows/dataset-figures.yml
      - .github/workflows/verify-dataset-cache.yml
      - scripts/refresh_dataset_figures.py
      - scripts/genia_grounded_overlap.py
      - scripts/qa/test_refresh_dataset_figures.py
      - scripts/qa/test_genia_nesting_counts.py
      - scripts/qa/native_gap_link_retention.py
      - scripts/qa/wikigold_*.py
      - scripts/qa/*nuner*.py
      - scripts/qa/test_native_gap_link_retention.py
      - scripts/qa/test_dataset_*.py
      - scripts/survey_dataset_ci_outcomes.py
      - scripts/figure_coverage_report.py
      - scripts/figure_catalog.py
      - docs/eval/figure-studies.csv
      - scripts/dataset_evidence_index.py
      - scripts/dataset_explorer.html.in
      - scripts/dataset_file_survey.py
      - scripts/qa/check_native_figure_layout.py
      - scripts/plot_*.py
      - scripts/qa/joint_baseline/**
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - crates/anno/src/lib.rs
      - crates/anno/src/viz/**
      - crates/anno/src/core/grounded/**
      - crates/anno-cli/src/cli/commands/dataset.rs
      - crates/anno-cli/src/cli/commands/dataset/**
      - crates/anno-cli/src/cli/commands/figure_catalog.rs
      - crates/anno-eval/src/eval/dataset_registry.rs
      - crates/anno-cli/src/main.rs
      - crates/anno-cli/src/cli/commands/mod.rs
      - crates/anno-cli/src/cli/commands/viz/**
      - crates/anno-cli/src/cli/commands/eval.rs
      - crates/anno-cli/src/cli/parser.rs
      - docs/figures/*.png
      - docs/figures/*.svg
      - docs/figures/*.html
      - docs/eval/*.json
      - docs/eval/dataset-explorer.html
      - docs/eval/dataset-*.csv
      - docs/eval/dataset-coverage.md
      - docs/eval/crossre-prompt-scope.csv
      - docs/eval/s3-publisher-file-matches.csv
      - docs/eval/wnut-submission-results.csv
  push:
    branches: [main]
    paths:
      - scripts/qa/joint_baseline/**
      - .github/workflows/dataset-figures.yml
      - scripts/refresh_dataset_figures.py
      - scripts/genia_grounded_overlap.py
      - scripts/qa/test_refresh_dataset_figures.py
      - scripts/qa/test_genia_nesting_counts.py
      - scripts/qa/native_gap_link_retention.py
      - scripts/qa/wikigold_*.py
      - scripts/qa/*nuner*.py
      - scripts/qa/test_native_gap_link_retention.py
      - scripts/qa/test_dataset_*.py
      - scripts/survey_dataset_ci_outcomes.py
      - scripts/figure_coverage_report.py
      - scripts/figure_catalog.py
      - docs/eval/figure-studies.csv
      - scripts/dataset_evidence_index.py
      - scripts/dataset_explorer.html.in
      - scripts/dataset_file_survey.py
      - scripts/qa/check_native_figure_layout.py
      - scripts/plot_*.py
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - crates/anno/src/lib.rs
      - crates/anno/src/viz/**
      - crates/anno/src/core/grounded/**
      - crates/anno-cli/src/cli/commands/dataset.rs
      - crates/anno-cli/src/cli/commands/dataset/**
      - crates/anno-cli/src/cli/commands/figure_catalog.rs
      - crates/anno-eval/src/eval/dataset_registry.rs
      - crates/anno-cli/src/main.rs
      - crates/anno-cli/src/cli/commands/mod.rs
      - crates/anno-cli/src/cli/commands/viz/**
      - crates/anno-cli/src/cli/commands/eval.rs
      - crates/anno-cli/src/cli/parser.rs
      - docs/figures/*.png
      - docs/figures/*.svg
      - docs/figures/*.html
      - docs/eval/*.json
      - docs/eval/dataset-explorer.html
      - docs/eval/dataset-*.csv
      - docs/eval/crossre-prompt-scope.csv
      - docs/eval/s3-publisher-file-matches.csv
      - docs/eval/wnut-*.csv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce published dataset figures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 'stable'
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Reconcile paired studies with their source counts
        run: |
          python3 -m unittest discover -s scripts/qa/joint_baseline -p 'test_relex_*.py'
          for pattern in 'test_crossre_prompt*.py' 'test_*nuner*.py' test_native_gap_link_retention.py; do
            python3 -m unittest discover -s scripts/qa -p "$pattern"
          done
      - name: Check publication, dataset evidence and GENIA measurements
        run: |
          uv run --python 3.12 --with-requirements scripts/refresh_dataset_figures.py python -m unittest discover -s scripts/qa -p test_refresh_dataset_figures.py
          uv run --python 3.12 --with-requirements scripts/refresh_dataset_figures.py python -m unittest discover -s scripts/qa -p 'test_dataset_*.py'
          python3 -m unittest discover -s scripts/qa -p test_genia_nesting_counts.py
      - name: Render and compare the published figures
        run: uv run --python 3.12 --script scripts/refresh_dataset_figures.py --check --output "$RUNNER_TEMP/dataset-figures"
      - name: Discover recorded inputs and render a named study from the artifact
        run: |
          target=$(cargo metadata --locked --format-version=1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          cd "$RUNNER_TEMP/dataset-figures"
          "$target/debug/anno" dataset evidence WikiGold --status scored --json > "$RUNNER_TEMP/scored.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["matched_ids"] == 1 and d["datasets"][0]["records"]' "$RUNNER_TEMP/scored.json"
          "$target/debug/anno" viz render wikigold-routing-paired -o "$RUNNER_TEMP/named.html"
          cmp "$RUNNER_TEMP/named.html" wikigold-routing-paired.html
      - name: Read the native reports at phone and documentation widths
        run: uv run --python 3.12 --with playwright==1.62.0 python scripts/qa/check_native_figure_layout.py "$RUNNER_TEMP/dataset-figures" --require-explorer
      - name: Save the rendered images and measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dataset-figures
          path: ${{ runner.temp }}/dataset-figures/
          if-no-files-found: error
          retention-days: 30

  s3:
    name: Verify the live S3 cache
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify-dataset-cache.yml

  publisher-files:
    name: Match cached inputs to measured publisher files
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cache-source-evidence.yml
