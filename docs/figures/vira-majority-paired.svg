<svg xmlns="http://www.w3.org/2000/svg" width="520" height="462" viewBox="0 0 520 462" role="img" aria-labelledby="paired-title paired-desc">
<title id="paired-title">Which ViRA turns does Fastino gain or lose?</title><desc id="paired-desc">Baseline Always predict negative reaction compared with candidate Fastino classifier on the same inputs. Total suggestions include exact and unmatched predictions. Held-out test. 8 Fastino abstentions · 72 dialogue turns. +13 net exact matches · 16 → 29. Gained 16 · lost 3. Retained 13 of 16 baseline matches (81.2%). Change in total suggestions is −8 (72 to 64). Change in unmatched is −21 (56 to 35). Validation. 15 Fastino abstentions · 71 dialogue turns. +11 net exact matches · 20 → 31. Gained 18 · lost 7. Retained 13 of 20 baseline matches (65.0%). Change in total suggestions is −15 (71 to 56). Change in unmatched is −26 (51 to 25).</desc>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#183541;font-size:17px}.heading{font-size:25px;font-weight:700}.cohort{font-size:20px;font-weight:700}.score{font-size:17px;font-weight:700;fill:#00675c}.measure{font-size:17px;font-weight:600}.tick,.scope{font-size:17px;fill:#415e66}</style>
<rect width="100%" height="100%" fill="white"/><text x="18" y="32" class="heading">Which ViRA turns does Fastino</text>
<text x="18" y="61" class="heading">gain or lose?</text>
