name: Verify S3 dataset cache
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Authorized S3 bucket (defaults to the ANNO_S3_BUCKET repository variable)
        required: false
        type: string
  workflow_call:
    inputs:
      bucket:
        description: Authorized S3 bucket
        required: false
        type: string

permissions: {}

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ inputs.bucket || vars.ANNO_S3_BUCKET }}
      CACHE_ROLE: ${{ vars.ANNO_AWS_ROLE_ARN }}
      # Same release as scripts/qa/prepare_matrix_wikigold.sh.
      WIKIGOLD_SHA256: c797a64d0cf73ed058363f77671486bcfd413e70fda1726ad4a6ba624455225f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the authorized role and bucket
        run: python3 .github/scripts/check_dataset_cache.py
      - name: Build the dataset verification tools
        run: cargo build --locked -p anno-eval --features eval --example wikigold_cache_probe --example cache_inventory
      - name: Assume the cache role with read-only access to the verification inputs
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ vars.ANNO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.ANNO_AWS_REGION || 'us-east-1' }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::${{ env.BUCKET }}",
               "Condition":{"StringEquals":{"s3:prefix":"datasets/"}}},
              {"Effect":"Allow","Action":"s3:GetObject","Resource":[
                "arn:aws:s3:::${{ env.BUCKET }}/datasets/WikiGold.cache",
                "arn:aws:s3:::${{ env.BUCKET }}/datasets/WikiGold.cache.latest.json",
                "arn:aws:s3:::${{ env.BUCKET }}/datasets/WikiGold.cache.manifest.json",
                "arn:aws:s3:::${{ env.BUCKET }}/datasets/by-sha256/${{ env.WIKIGOLD_SHA256 }}/WikiGold.cache"]}
            ]}
      - name: Count current objects and verify the pinned WikiGold bytes
        shell: bash
        run: |
          set -euo pipefail
          figures="$RUNNER_TEMP/s3-dataset-cache-figures"
          mkdir -p "$figures"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          # JSON output lets the AWS CLI combine all pages before applying the query.
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix datasets/ \
            --output json --query 'Contents[].Key' > "$work/keys.json" 2> "$work/aws.stderr" || {
            echo "::error::Unable to list the configured dataset prefix. Check the role's ListBucket permission."
            exit 1
          }
          count=$(jq 'length' "$work/keys.json")
          echo "Current objects under datasets/: $count" | tee -a "$GITHUB_STEP_SUMMARY"

          target/debug/examples/cache_inventory "$work/keys.json" | tee -a "$GITHUB_STEP_SUMMARY"

          snapshot="datasets/by-sha256/$WIKIGOLD_SHA256/WikiGold.cache"
          legacy="datasets/WikiGold.cache"
          for key in "$snapshot" "$legacy"; do
            if jq -e --arg key "$key" '(. // []) | index($key) != null' "$work/keys.json" >/dev/null; then
              # One extra byte makes a longer object fail even if its prefix matches.
              aws s3api get-object --bucket "$BUCKET" --key "$key" --range bytes=0-318530 \
                "$work/sample" >/dev/null 2> "$work/aws.stderr" || {
                echo "::error::Unable to read the pinned WikiGold object. Check the role's GetObject permission."
                exit 1
              }
              echo "$WIKIGOLD_SHA256  $work/sample" | sha256sum --check --status || {
                echo 'WikiGold checksum mismatch.' | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              }
              echo "Verified pinned WikiGold bytes (SHA-256 $WIKIGOLD_SHA256)." | tee -a "$GITHUB_STEP_SUMMARY"
              target/debug/examples/cache_inventory "$work/keys.json" "$key" "$work/sample" > "$figures/s3-cache-inventory.json"
              tee -a "$GITHUB_STEP_SUMMARY" < "$figures/s3-cache-inventory.json"
              exit 0
            fi
          done
          echo 'Neither pinned WikiGold object path was present. No checksum verified.' | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Load WikiGold from its registered upstream with S3 disabled
        env:
          ANNO_S3_CACHE: "0"
          ANNO_CACHE_DIR: ${{ runner.temp }}/wikigold-upstream
        run: |
          target/debug/examples/wikigold_cache_probe > "$RUNNER_TEMP/s3-dataset-cache-figures/wikigold-upstream.json" 2> "$RUNNER_TEMP/upstream.err" || {
            echo "::error::Could not score the registered WikiGold source. Check upstream availability and parser compatibility."
            exit 1
          }
      - name: Compare cold S3 and warm local loader results with upstream
        env:
          ANNO_S3_CACHE: "1"
          ANNO_S3_BUCKET: ${{ env.BUCKET }}
          ANNO_CACHE_DIR: ${{ runner.temp }}/wikigold-cache
        shell: bash
        run: |
          set -euo pipefail
          probe=target/debug/examples/wikigold_cache_probe
          figures="$RUNNER_TEMP/s3-dataset-cache-figures"
          for stage in cold warm; do
            "$probe" > "$figures/wikigold-$stage.json" 2> "$RUNNER_TEMP/probe.err" || {
              echo "::error::WikiGold $stage load failed. Check the configured cache and pinned input."
              exit 1
            }
          done
          results=("$figures"/wikigold-{upstream,cold,warm}.json)
          jq -cs '.' "${results[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -es --arg sha "$WIKIGOLD_SHA256" '
            map(.source) == ["OriginalUrl", "S3Cache", "LocalCache"]
            and all(.[]; .dataset.sha256 == $sha and .heuristic_score.expected > 0)
            and (map(.dataset) | unique | length == 1)
            and (map(.heuristic_score) | unique | length == 1)
          ' "${results[@]}" >/dev/null
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Plot the verified cache inventory
        shell: bash
        run: |
          set -euo pipefail
          figures="$RUNNER_TEMP/s3-dataset-cache-figures"
          uv run --python 3.12 --with matplotlib==3.10.8 python scripts/plot_s3_cache_inventory.py \
            "$figures/s3-cache-inventory.json" "$figures"
          test -s "$figures/s3-cache-inventory.png"
          test -s "$figures/s3-cache-inventory.svg"
      - name: Save the cache figure and verification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-dataset-cache-figures
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/s3-dataset-cache-figures/s3-cache-inventory.png
            ${{ runner.temp }}/s3-dataset-cache-figures/s3-cache-inventory.svg
            ${{ runner.temp }}/s3-dataset-cache-figures/s3-cache-inventory.json
            ${{ runner.temp }}/s3-dataset-cache-figures/wikigold-upstream.json
            ${{ runner.temp }}/s3-dataset-cache-figures/wikigold-cold.json
            ${{ runner.temp }}/s3-dataset-cache-figures/wikigold-warm.json
