<svg xmlns="http://www.w3.org/2000/svg" width="984" height="455" viewBox="0 0 984 455" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Choosing when to link a pronoun on GAP</title><desc id="chart-desc">Correct matches and unmatched predictions per 100 excerpts. Each panel shares the correct and unmatched rate axes. The numbered points identify the exact counts and recall in its table. Identical counts share a point. GAP test, supplied mentions has 2,000 excerpts and 1,773 gold items. Stock has 3 correct, 14 unmatched, and 0.2% recall. Neutral type has 131 correct, 141 unmatched, and 7.4% recall. Classified mentions has 142 correct, 218 unmatched, and 8.0% recall. Rival 0.15 (dev choice) has 106 correct, 128 unmatched, and 6.0% recall. Rival 0.1 has 128 correct, 138 unmatched, and 7.2% recall. Rival 0.3 has 47 correct, 59 unmatched, and 2.7% recall. Threshold 0.025 (dev choice) has 108 correct, 108 unmatched, and 6.1% recall. Threshold 0.1 has 44 correct, 37 unmatched, and 2.5% recall. Threshold 0.3 has 0 correct, 0 unmatched, and 0.0% recall.</desc>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#183541;font-size:13px}.heading{font-size:24px;font-weight:700}.subtitle{font-size:15px;fill:#456371}.cohort{font-size:19px;font-weight:700}.scope,.axis{fill:#456371}.small,.axis{font-size:11px}.col{font-weight:700;font-size:12px}.num{text-anchor:end;font-variant-numeric:tabular-nums}.key{font-size:12px;font-weight:700;fill:#006867}.plot-key{paint-order:stroke;stroke:white;stroke-width:2;stroke-linejoin:round}.rule,.grid{fill:none;stroke:#d5e0e2;stroke-width:1}.frontier{fill:none;stroke:#6da8a2;stroke-width:1.6}.optimal{fill:#006867;stroke:white;stroke-width:1.2}.dominated{fill:white;stroke:#456371;stroke-width:1.5}.leader{stroke:#658384;stroke-width:.8}</style>
<rect width="984" height="455" fill="white"/><text x="32" y="38" class="heading">Choosing when to link a pronoun on GAP</text>
<text x="32" y="67" class="subtitle">Correct matches and unmatched predictions per 100 excerpts.</text>
<text x="32" y="86" class="scope">Filled points trace the best match count at each unmatched budget. Open points have a better alternative.</text>
