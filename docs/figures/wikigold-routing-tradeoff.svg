<svg xmlns="http://www.w3.org/2000/svg" width="984" height="1341" viewBox="0 0 984 1341" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Running NuNER on stock-skipped sentences</title><desc id="chart-desc">Correct matches and unmatched predictions per 100 sentences. Each panel shares the correct and unmatched rate axes. The numbered points identify the exact counts and recall in its table. Identical counts share a point. WNUT-17 test · BERT absent has 295 sentences and 264 gold items. Stock has 31 correct, 257 unmatched, and 11.7% recall. Run NuNER has 111 correct, 397 unmatched, and 42.0% recall. WNUT-17 test · BERT loaded has 295 sentences and 264 gold items. Stock has 87 correct, 263 unmatched, and 33.0% recall. Run NuNER has 101 correct, 382 unmatched, and 38.3% recall. WikiGold · BERT absent has 313 sentences and 731 gold items. Stock has 231 correct, 307 unmatched, and 31.6% recall. Run NuNER has 435 correct, 274 unmatched, and 59.5% recall. WikiGold · BERT loaded has 313 sentences and 731 gold items. Stock has 563 correct, 233 unmatched, and 77.0% recall. Run NuNER has 567 correct, 254 unmatched, and 77.6% recall.</desc>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#183541;font-size:13px}.heading{font-size:24px;font-weight:700}.subtitle{font-size:15px;fill:#456371}.cohort{font-size:19px;font-weight:700}.scope,.axis{fill:#456371}.small,.axis{font-size:11px}.col{font-weight:700;font-size:12px}.num{text-anchor:end;font-variant-numeric:tabular-nums}.key{font-size:12px;font-weight:700;fill:#006867}.plot-key{paint-order:stroke;stroke:white;stroke-width:2;stroke-linejoin:round}.rule,.grid{fill:none;stroke:#d5e0e2;stroke-width:1}.frontier{fill:none;stroke:#6da8a2;stroke-width:1.6}.optimal{fill:#006867;stroke:white;stroke-width:1.2}.dominated{fill:white;stroke:#456371;stroke-width:1.5}.leader{stroke:#658384;stroke-width:.8}</style>
