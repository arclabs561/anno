name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to publish to crates.io"
        required: true
        default: "dry-run"

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Guard (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${INPUTS_CONFIRM}" != "publish" ]; then
            echo "Refusing to publish: set workflow input confirm=publish"
            exit 1
          fi
        env:
          INPUTS_CONFIRM: ${{ inputs.confirm }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          lookup-only: true

      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          # The published 0.10.0 baseline does not compile with the bundled-*
          # features (its package is missing the JSON assets; fixed in 0.11.0),
          # so all-features baseline builds fail forever. Default features are
          # the supported gate.
          feature-group: default-features

      - name: Authenticate (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publish bottom-up by dep order:
      # anno -> anno-eval -> anno-cli
      #
      # Each step is idempotent: if a crate is already published at the current
      # version, cargo's "crate version X is already uploaded" response is treated
      # as success and the step moves on. Any other failure aborts the workflow.
      #
      # The legacy anno-core / anno-metrics / anno-graph crates are frozen on
      # crates.io at 0.8.0 (folded into `anno` post-Phase-B, 2026-04-26) and
      # are not part of this publish chain.
      - name: cargo publish (anno)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./.github/workflows/publish-crate.sh anno

      - name: cargo publish (anno-eval)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./.github/workflows/publish-crate.sh anno-eval

      - name: cargo publish (anno-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./.github/workflows/publish-crate.sh anno-cli
