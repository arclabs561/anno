# Deliberate copies can use a rule-specific nosemgrep annotation with the
# ownership or synchronization reason beside the binding.
rules:
  - id: unnecessary-clone-in-loop
    patterns:
      - pattern-inside: |
          for $ITEM in $ITER { ... }
      - pattern: let $CLONED = $VALUE.clone();
      - pattern-not: let $CLONED = $ITEM.clone();
      - pattern-not: let $CLONED = $CACHE.lock().unwrap().clone();
    message: "Check whether this clone can be shared or moved outside the loop."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include: ["**/eval/**", "**/backends/**"]

  - id: cache-clone-in-loop
    patterns:
      - pattern-inside: |
          for $ITEM in $ITER { ... }
      - pattern: let $COPY = $CACHE.lock().unwrap().clone();
    message: "This loop locks and clones the cache on each iteration. Consider sharing one snapshot if its contents may stay fixed."
    languages: [rust]
    severity: WARNING
    metadata:
      category: performance
    paths:
      include: ["**/eval/**"]

  - id: session-acquire-without-release
    patterns:
      - pattern-inside: |
          let $SESSION = $POOL.acquire()?;
          ...
      - pattern-either:
          - pattern: std::mem::forget($SESSION)
          - pattern: core::mem::forget($SESSION)
          - pattern: mem::forget($SESSION)
    message: "Forgetting an acquired session suppresses its destructor. Let its guard leave scope or explicitly release it."
    languages: [rust]
    severity: WARNING
    metadata:
      category: resource-management
    paths:
      include: ["**/session_pool.rs", "**/backends/**"]

  - id: arc-clone-unnecessary
    pattern-either:
      - pattern: |
          let $FIRST = Arc::new($DATA);
          let $SECOND = $FIRST.clone();
          drop($FIRST);
      - pattern: |
          let $FIRST = Arc::new($DATA);
          let $SECOND = Arc::clone(&$FIRST);
          drop($FIRST);
    message: "The original Arc is dropped immediately after this clone. Move it into the new binding instead."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include: ["**/eval/**", "**/backends/**"]

  - id: large-vec-clone
    patterns:
      - pattern-either:
          - pattern-inside: |
              fn $F(..., $VALUES: Vec<$T>, ...) { ... }
          - pattern-inside: |
              let $VALUES: Vec<$T> = $INIT;
              ...
      - pattern: let $COPY = $VALUES.clone();
    message: "Cloning this Vec copies its elements. For large collections, consider borrowing or sharing the data."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include: ["**/eval/**", "**/backends/**"]
