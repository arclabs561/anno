name: Compare S3 cache with measured publisher files
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Authorized S3 bucket (defaults to the ANNO_S3_BUCKET repository variable)
        required: false
        type: string
  workflow_call:
    inputs:
      bucket:
        description: Authorized S3 bucket
        required: false
        type: string

permissions: {}

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ inputs.bucket || vars.ANNO_S3_BUCKET }}
      CACHE_ROLE: ${{ vars.ANNO_AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the authorized role and bucket
        run: python3 .github/scripts/check_dataset_cache.py
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Install the pinned comparison dependencies
        run: |
          uv sync --python 3.12 --script scripts/qa/cache_source_evidence.py
          uv sync --python 3.12 --script scripts/plot_s3_source_evidence.py
      - name: Assume the cache role for the dataset prefix listing
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ env.CACHE_ROLE }}
          aws-region: ${{ vars.ANNO_AWS_REGION || 'us-east-1' }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket",
             "Resource":"arn:aws:s3:::${{ env.BUCKET }}","Condition":{"StringEquals":{"s3:prefix":"datasets/"}}}]}
      - name: Verify measured publisher files in exact-key read sessions
        run: >-
          uv run --offline --python 3.12 --script scripts/qa/cache_source_evidence.py
          "$RUNNER_TEMP/cache-source-evidence" --bucket "$BUCKET" --role "$CACHE_ROLE"
      - name: Plot the measured-file comparison
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/cache-source-evidence"
          if test -f "$evidence/cache-source-coverage.json"; then
            uv run --offline --python 3.12 --script scripts/plot_s3_source_evidence.py "$evidence/cache-source-coverage.json" "$evidence"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cache-source-evidence
          path: |
            ${{ runner.temp }}/cache-source-evidence/cache-source-coverage.json
            ${{ runner.temp }}/cache-source-evidence/publisher-file-matches.csv
            ${{ runner.temp }}/cache-source-evidence/s3-publisher-matches.png
            ${{ runner.temp }}/cache-source-evidence/s3-publisher-matches.svg
          if-no-files-found: error
          retention-days: 30
