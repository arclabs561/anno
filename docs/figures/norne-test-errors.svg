<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 2202" width="500" height="2202" role="img" aria-labelledby="eval-title eval-desc">
<title id="eval-title">Which Norwegian place names does the heuristic mistype?</title>
<desc id="eval-desc">669 exact matches, 1046 same-span label errors, 369 partial overlaps, 309 missed gold entities and 456 extra predictions. There are 2393 gold entities and 2540 predictions. Of 369 partial span overlaps, 284 also had a different label and 85 kept the gold label. Of 521 gold ORG mentions, 66 were exact, 280 had the right span and wrong type, 104 overlapped partially and 71 were missed. Most frequent same-span label change: GPE_LOC to PER (319).</desc>
