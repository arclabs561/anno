# OpenGrep rules specific to anno's evaluation framework
# Catches evaluation-specific anti-patterns and bugs

rules:
  # ============================================================================
  # Evaluation Loop Patterns
  # ============================================================================
  
  - id: evaluation-loop-backend-recreation
    pattern: |
      for $EXAMPLE in $EXAMPLES {
          ...
          let $BACKEND = BackendFactory::create($NAME)?;
          ...
          $BACKEND.extract_entities(...)?;
          ...
      }
    message: "Backend recreated in evaluation loop. Reuse backend outside loop for performance."
    languages: [rust]
    severity: WARNING
    metadata:
      category: performance
    paths:
      include:
        - "**/eval/task_evaluator.rs"
        - "**/eval/harness.rs"

  - id: per-example-scores-multiple-iterations
    patterns:
      - pattern: |
          for $SCORE in $SCORES { ... }
          for $OTHER in $SCORES { ... }
      - metavariable-regex:
          metavariable: $SCORES
          regex: (?i).*score.*
    message: "Two adjacent loops traverse the same scores. Check whether both passes are necessary."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include:
        - "**/eval/task_evaluator.rs"

  - id: confidence-interval-recomputation
    patterns:
      - pattern: $MODEL.extract_entities(...)
      - pattern-inside: |
          fn $F(...) { ... }
      - metavariable-regex:
          metavariable: $F
          regex: ^compute_confidence_intervals($|_)
    message: "Confidence interval computation calls entity extraction. Check whether the existing per-example scores can be reused."
    languages: [rust]
    severity: WARNING
    metadata:
      category: performance
    paths:
      include:
        - "**/eval/task_evaluator.rs"

  # ============================================================================
  # Metric Computation Patterns
  # ============================================================================
  
  - id: stratified-metrics-placeholder
    patterns:
      - pattern: |
          by_entity_type.insert($KEY, MetricWithCI { mean: $AGG, ..$BASE })
      - metavariable-regex:
          metavariable: $AGG
          regex: ^(overall|aggregate)(_[A-Za-z0-9_]+)?$
    message: "An entity-type bucket receives a value named overall or aggregate. Verify that each bucket uses its own observations."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/task_evaluator.rs"

  - id: metric-calculation-without-edge-cases
    patterns:
      - pattern: |
          let $F1 = 2.0 * ($P * $R) / ($P + $R);
      - pattern-not-inside: |
          if $P + $R == 0.0 { return ...; }
          ...
          let $F1 = 2.0 * ($P * $R) / ($P + $R);
    message: "Check the zero denominator in the harmonic mean."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/metrics.rs"
        - "**/eval/ner_metrics.rs"

  # ============================================================================
  # Task-Dataset-Backend Mapping
  # ============================================================================
  
  - id: task-dataset-mismatch
    pattern: |
      for $TASK in $TASKS {
          for $DATASET in $DATASETS { evaluate($TASK, $DATASET, ...)?; }
      }
    message: "These nested loops immediately evaluate every task and dataset pair. Verify compatibility upstream."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/task_evaluator.rs"
        - "**/eval/task_mapping.rs"

  - id: backend-capability-check
    pattern: |
      let $BACKEND = BackendFactory::create($NAME)?;
      $BACKEND.$METHOD(...)?;
    message: "A backend method is called immediately after construction. Verify its required capability."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/**"

  # ============================================================================
  # Bias Analysis Patterns
  # ============================================================================
  
  - id: bias-stratification-empty-groups
    pattern: |
      for $GROUP in $GROUPS { compute_metrics($GROUP)?; }
    message: "Each group goes directly into metric computation. Verify handling of empty groups."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/gender_bias.rs"
        - "**/eval/demographic_bias.rs"
        - "**/eval/length_bias.rs"

  - id: temporal-stratification-missing-metadata
    pattern: |
      compute_temporal_stratification(..., None, ...)
    message: "A temporal stratification call passes an explicitly absent argument. Check whether its temporal metadata is available."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/temporal_bias.rs"
        - "**/eval/task_evaluator.rs"

  # ============================================================================
  # Robustness Testing Patterns
  # ============================================================================
  
  - id: robustness-testing-limit-check
    patterns:
      - pattern: |
          for $EXAMPLE in $EXAMPLES {
              let $PERTURBED = apply_perturbation($EXAMPLE, ...)?;
              ...
          }
      - pattern-not: |
          for $EXAMPLE in $ITER.take(...) { ... }
      - pattern-not: |
          for $EXAMPLE in $EXAMPLES { ... if $COND { break; } ... }
    message: "Perturbations run on the input iterator. Verify that the iterator or loop bounds the work."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include:
        - "**/eval/robustness.rs"

  # ============================================================================
  # Coreference Resolution Patterns
  # ============================================================================
  
  - id: coref-chain-validation
    pattern-either:
      - pattern: CorefChain::new(Vec::new())
      - pattern: CorefChain::new(vec![])
      - pattern: |
          CorefChain { mentions: Vec::new(), ..$BASE }
    message: "A coreference chain is initialized with no mentions. Verify that downstream metrics accept empty chains."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/coref_resolver.rs"
        - "**/eval/cdcr.rs"

  - id: coref-metric-computation
    pattern: |
      compute_muc($GOLD, $PRED)?;
      ...
      compute_b3($PRED, $GOLD)?;
    message: "MUC and B3 receive the two arguments in opposite order. Verify the gold and prediction inputs."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/coref_metrics.rs"

