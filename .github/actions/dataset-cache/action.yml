name: Read an authorized dataset cache
description: Enable job-local reads from the selected S3 dataset prefix.
inputs:
  bucket:
    required: true
    description: Authorized S3 bucket
  role:
    required: true
    description: Authorized AWS role
  region:
    required: true
    description: AWS region
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        CACHE_ROLE: ${{ inputs.role }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/check_dataset_cache.py"
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}
        mask-aws-account-id: true
        inline-session-policy: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject",
          "Resource":"arn:aws:s3:::${{ inputs.bucket }}/datasets/*"}]}
    - shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
      run: |
        aws --version
        printf 'ANNO_S3_CACHE=1\nANNO_S3_BUCKET=%s\n' "$BUCKET" >> "$GITHUB_ENV"
