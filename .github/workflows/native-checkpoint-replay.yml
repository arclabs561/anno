name: Native extraction checkpoint replay

on:
  workflow_dispatch:
  pull_request:
    paths: &checkpoint_paths
      - '.github/workflows/native-checkpoint-replay.yml'
      - 'scripts/qa/checkpoint_replay/**'
      - 'scripts/qa/nuner_fallback_routing.py'
      - 'scripts/qa/wnut_native_replay.py'
      - 'crates/anno/examples/stacked_nuner_routing.rs'
      - 'crates/anno/src/backends/**'
      - 'crates/anno/src/lib.rs'
      - 'crates/anno-cli/src/cli/**'
      - 'crates/anno/Cargo.toml'
      - 'crates/anno-cli/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths: *checkpoint_paths

permissions:
  contents: read

concurrency:
  group: native-checkpoint-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check cold downloads, offline hits and corrupt caches
        run: python -m unittest discover -s scripts/qa/checkpoint_replay -p test_cache.py
      - name: Compute keys from the pinned model files
        id: pins
        run: |
          echo "native=$(python scripts/qa/checkpoint_replay/prepare.py native --key)" >> "$GITHUB_OUTPUT"
          echo "stacked=$(python scripts/qa/checkpoint_replay/prepare.py stacked --key)" >> "$GITHUB_OUTPUT"
      - name: Restore native checkpoint files
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/anno-native-weights
          key: ${{ steps.pins.outputs.native }}
      - name: Download and verify native checkpoint files on cache miss
        if: steps.native.outputs.cache-hit != 'true'
        run: python scripts/qa/checkpoint_replay/prepare.py native --fetch --models "$RUNNER_TEMP/anno-native-weights"
      - name: Save verified native checkpoint files
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/anno-native-weights
          key: ${{ steps.pins.outputs.native }}
      - name: Restore stacked checkpoint files
        id: stacked
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/anno-stacked-weights
          key: ${{ steps.pins.outputs.stacked }}
      - name: Download and verify stacked checkpoint files on cache miss
        if: steps.stacked.outputs.cache-hit != 'true'
        run: python scripts/qa/checkpoint_replay/prepare.py stacked --fetch --models "$RUNNER_TEMP/anno-stacked-weights"
      - name: Save verified stacked checkpoint files
        if: steps.stacked.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/anno-stacked-weights
          key: ${{ steps.pins.outputs.stacked }}
      - name: Verify and unpack the ONNX Runtime CPU library
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ort"
          python -m pip download --no-deps --only-binary=:all: -d "$RUNNER_TEMP/ort" onnxruntime==1.24.2
          cd "$RUNNER_TEMP/ort"
          wheel=onnxruntime-1.24.2-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          echo "09aa6f8d766b4afc3cfba68dd10be39586b49f9462fbd1386c5d5644239461ca  $wheel" | sha256sum -c -
          unzip -j "$wheel" 'onnxruntime/capi/libonnxruntime*.so*'
          ln -s libonnxruntime.so.1.24.2 libonnxruntime.so
          ln -s libonnxruntime.so.1.24.2 libonnxruntime.so.1
          echo "ORT_LIB_LOCATION=$PWD" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
      - run: cargo build --locked -p anno-cli --no-default-features --features gliner2-fastino,extractor-html2text
      - name: Replay pinned checkpoints sequentially with a 6 GiB memory limit
        shell: bash
        run: |
          sudo systemd-run --pipe --wait --collect --uid="$(id -un)" --working-directory="$PWD" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% \
            --setenv="LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            "$(command -v python)" scripts/qa/checkpoint_replay/run.py \
            --models "$RUNNER_TEMP/anno-native-weights" --binary target/debug/anno --aggregate --receipt checkpoint-receipt.json > "$RUNNER_TEMP/checkpoint.log" 2>&1 || {
                echo "::error::Checkpoint replay failed. Inspect completed model and case counts in the public receipt."
                exit 1
              }
      - name: Build the default-stack layer observer
        run: cargo build --locked -p anno --no-default-features --features onnx --example stacked_nuner_routing
      - name: Replay the default CLI and stock routing with and without BERT
        run: |
          sudo systemd-run --pipe --wait --collect --uid="$(id -un)" --working-directory="$PWD" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p CPUQuota=200% \
            --setenv="LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            "$(command -v python)" scripts/qa/checkpoint_replay/stacked.py \
            --cli target/debug/anno --worker target/debug/examples/stacked_nuner_routing \
            --models "$RUNNER_TEMP/anno-stacked-weights" --aggregate --receipt stacked-receipt.json > "$RUNNER_TEMP/stacked.log" 2>&1 || {
                echo "::error::Default-stack routing verification failed. Replay the pinned fixtures to inspect predictions locally."
                exit 1
              }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-checkpoint-receipt
          path: |
            checkpoint-receipt.json
            stacked-receipt.json
