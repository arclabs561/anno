name: Maverick coreference verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/maverick-coref.yml'
      - 'crates/anno/src/backends/coref/maverick*'
      - 'crates/anno/tests/fixtures/maverick-worker.sh'
      - 'crates/anno/Cargo.toml'
      - 'crates/anno/examples/maverick_export.rs'
      - 'scripts/download_maverick_weights.py'
      - 'scripts/qa/maverick/**'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked -p anno --no-default-features --lib backends::coref::maverick::tests

  real-weights:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install pinned CPU runtime
        run: |
          grep -Ex 'torch==[0-9.]+[+]cpu' scripts/qa/maverick/requirements-cpu-py312.txt > "$RUNNER_TEMP/torch-cpu.txt"
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch-cpu.txt"
          python -m pip install -r scripts/qa/maverick/requirements-cpu-py312.txt
          python -m pip check
      - name: Test local checkpoint preparation
        run: python -m unittest discover -s scripts/qa/maverick -p test_weights.py
      - name: Verify checkpoint and encoder digests and run offline inference
        run: python scripts/qa/maverick/verify.py "$RUNNER_TEMP"
      - name: Replay matched historical decisions and independent GAP controls
        id: replay
        run: |
          set -euo pipefail
          export MAVERICK_PYTHON="$(command -v python)"
          export HF_HOME="$RUNNER_TEMP/maverick-qa"
          export HF_HUB_CACHE="$HF_HOME/hub"
          export TRANSFORMERS_CACHE="$HF_HUB_CACHE"
          export MAVERICK_MODEL_PATH="$HF_HOME/maverick/maverick-ontonotes.safetensors"
          export ANNO_NO_DOWNLOADS=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 TOKENIZERS_PARALLELISM=false
          cargo build --locked -p anno --no-default-features --features onnx --example coref_gap_panel
          base=https://raw.githubusercontent.com/google-research-datasets/gap-coreference/83135f26025cdd705c04f77e940d0c9201116b80
          for split in test validation; do
            curl --fail --silent --show-error --location "$base/gap-$split.tsv" -o "$RUNNER_TEMP/gap-$split.tsv"
          done
          python scripts/qa/maverick_gap_288.py --test "$RUNNER_TEMP/gap-test.tsv" --validation "$RUNNER_TEMP/gap-validation.tsv" --binary target/debug/examples/coref_gap_panel | tee "$RUNNER_TEMP/current.jsonl"
          for mode in predicted supplied; do
            python scripts/qa/coref_gap.py "$RUNNER_TEMP/gap-test.tsv" target/debug/examples/coref_gap_panel maverick "$mode" "$RUNNER_TEMP/gap-$mode.json"
          done
      - name: Check out the exact previously verified runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e2910e585f1efdb55b22a87fe6a48d98754bc392
          path: legacy-runtime
          persist-credentials: false
      - name: Compare upgraded and legacy output on the same 305 inputs
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/legacy-env"
          export MAVERICK_PYTHON="$RUNNER_TEMP/legacy-env/bin/python"
          requirements=legacy-runtime/scripts/qa/maverick/requirements-cpu-py312.txt
          grep -Ex 'torch==[0-9.]+[+]cpu' "$requirements" > "$RUNNER_TEMP/legacy-torch.txt"
          "$MAVERICK_PYTHON" -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/legacy-torch.txt"
          "$MAVERICK_PYTHON" -m pip install -r "$requirements"
          "$MAVERICK_PYTHON" -m pip check
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo build --manifest-path legacy-runtime/Cargo.toml --locked -p anno --no-default-features --features onnx --example coref_gap_panel
          export HF_HOME="$RUNNER_TEMP/maverick-qa"
          export HF_HUB_CACHE="$HF_HOME/hub" TRANSFORMERS_CACHE="$HF_HOME/hub"
          export MAVERICK_MODEL_PATH="$HF_HOME/maverick/maverick-ontonotes.safetensors"
          export ANNO_NO_DOWNLOADS=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 TOKENIZERS_PARALLELISM=false
          PYTHONPATH=legacy-runtime/scripts/qa "$MAVERICK_PYTHON" -c "from coref_gap import model_identity; model_identity('maverick', 'predicted')"
          python scripts/qa/maverick_gap_288.py --test "$RUNNER_TEMP/gap-test.tsv" --validation "$RUNNER_TEMP/gap-validation.tsv" --binary "$CARGO_TARGET_DIR/debug/examples/coref_gap_panel" | tee "$RUNNER_TEMP/legacy.jsonl"
          cmp "$RUNNER_TEMP/legacy.jsonl" "$RUNNER_TEMP/current.jsonl"
          echo "Current and legacy agree on all 305 GAP decisions and full predicted span partitions."
      - name: Compare both frozen mention modes with their published decisions
        if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          baseline = json.loads(Path("docs/eval/coref-panels.json").read_text())["gap"]
          for mode in ("predicted", "supplied"):
              actual = json.loads((Path(os.environ["RUNNER_TEMP"]) / f"gap-{mode}.json").read_text())
              expected = baseline["arms"]["maverick/" + mode]
              assert actual["ids"] == baseline["ids"] and actual["gold_pairs"] == baseline["gold_pairs"]
              assert actual["per_id"] == expected["per_id"] and actual["counts"] == expected["counts"]
              print(f"Frozen GAP {mode}: all {len(actual['ids'])} decisions and aggregate counts match.")
          PY
