name: Coreference benchmarks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bench-coref.yml'
      - 'crates/anno/benches/coref.rs'
permissions:
  contents: read
jobs:
  coref:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure mention-ranking coreference
        run: |
          mkdir -p bench-results
          rustc -Vv > bench-results/rust.txt
          lscpu > bench-results/cpu.txt
          cargo bench --locked -p anno --no-default-features --bench coref -- --noplot | tee bench-results/coref.txt
          cp -r target/criterion bench-results/
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coref-criterion
          path: bench-results/
          if-no-files-found: error
