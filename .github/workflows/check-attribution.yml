name: Check attribution footer

on:
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read

jobs:
  check:
    if: github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Check for a terminal footer
        run: uv run .github/scripts/strip_attribution.py --check-event
