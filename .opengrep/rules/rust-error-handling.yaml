# OpenGrep rules for error handling patterns
# Based on bugs found and fixed in the codebase

rules:
  # ============================================================================
  # Mutex Poisoning (Based on BUGS_FIXED.md - Deadlock Bug)
  # ============================================================================
  
  - id: mutex-lock-without-poison-handling
    patterns:
      - pattern: |
          let $VAR = $MUTEX.lock();
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          $VAR.unwrap_or_else(...)
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          $VAR.map_err(...)
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          match $VAR { $P => $A, $Q => $B }
      - pattern-not-inside: |
          let $VAR = $MUTEX.lock();
          ...
          if let Ok($VALUE) = $VAR { ... }
    message: "Mutex lock without poison handling. Use unwrap_or_else(|e| e.into_inner()) to handle poisoning, or match/if-let for explicit handling. See BUGS_FIXED.md for deadlock bug example."
    languages: [rust]
    severity: WARNING
    metadata:
      category: reliability
      cwe: "CWE-667: Improper Locking"
    paths:
      include:
        - "**/eval/**"
        - "**/sync.rs"
        - "**/session_pool.rs"
        - "**/backends/**"
      exclude:
        - "**/tests/**"

  # ============================================================================
  # Error Context and Propagation
  # ============================================================================
  
  - id: error-conversion-without-context
    pattern: |
      $RESULT.map_err(|$E| Error::$TYPE(format!("{}", $E)))
    message: "Error conversion without context. Add context about what operation failed (e.g., 'Failed to download model: {}')."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/**"
        - "**/eval/**"

  - id: result-propagation-without-context
    pattern: |
      $FUNC()?;
    message: "Result propagation without context. Consider adding context with map_err for better error messages."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/**"
        - "**/eval/**"

  # ============================================================================
  # Error Type Consistency
  # ============================================================================
  
  - id: backend-specific-error-types
    patterns:
      # The Rust matcher cannot parse an ellipsis in an enum variant list.
      # Restrict the text matcher to Rust declaration lines and error types.
      - pattern: enum $ERROR { ... }
      - pattern-regex: '(?m)^\h*(?:pub(?:\([^)]*\))?\h+)?enum\h+'
      - metavariable-regex:
          metavariable: $ERROR
          regex: '.*Error$'
      - pattern-not-inside: |
          enum $ERROR { ... }
          ...
          impl From<$ERROR> for crate::Error { ... }
      - pattern-not-inside: |
          impl From<$ERROR> for crate::Error { ... }
          ...
          enum $ERROR { ... }
    message: "Backend error enum has no nearby From conversion to crate::Error in this file. Check for an existing conversion before adding one."
    languages: [generic]
    options:
      generic_ellipsis_max_span: 500
    severity: INFO
    metadata:
      category: maintainability
    paths:
      include:
        - "**/backends/**/*.rs"

