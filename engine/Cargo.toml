[package]
name = "saltglass-reader"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anno = { git = "https://github.com/arclabs561/anno", rev = "136a7e7aea5c8abc6b722822c2b5f5473f5ede88", default-features = false, features = ["bundled-crf-weights"] }
wasm-bindgen = "=0.2.130"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
