<title id="chart-title">Running NuNER on stock-skipped sentences</title><desc id="chart-desc">Horizontal position counts predictions without a reference match. Rates are per 100 sentences. Settings with identical counts share a mark. WNUT-17 test · BERT absent has 295 sentences and 264 gold items. Stock has 31 correct, 257 unmatched, and 288 total suggestions. Run NuNER has 111 correct, 397 unmatched, and 508 total suggestions. WNUT-17 test · BERT loaded has 295 sentences and 264 gold items. Stock has 87 correct, 263 unmatched, and 350 total suggestions. Run NuNER has 101 correct, 382 unmatched, and 483 total suggestions. WikiGold · BERT absent has 313 sentences and 731 gold items. Stock has 231 correct, 307 unmatched, and 538 total suggestions. Run NuNER has 435 correct, 274 unmatched, and 709 total suggestions. WikiGold · BERT loaded has 313 sentences and 731 gold items. Stock has 563 correct, 233 unmatched, and 796 total suggestions. Run NuNER has 567 correct, 254 unmatched, and 821 total suggestions. </desc>
