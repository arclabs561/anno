rules:
  - id: direct-mutex-lock-bypass-helper
    pattern: $MUTEX.lock().unwrap()
    message: "Direct mutex lock bypasses sync::lock helper. Use lock(&mutex) for proper poison handling. The sync::lock helper handles poisoning gracefully."
    languages: [rust]
    severity: WARNING
    metadata:
      category: reliability
      cwe: "CWE-667: Improper Locking"
    paths:
      include:
        - "**/eval/**"
        - "**/backends/**"
      exclude:
        - "**/tests/**"
        - "**/sync.rs"

  - id: mutex-double-lock-deadlock
    pattern: |
      if let Ok($BINDING) = $MUTEX.lock() {
        ...
      } else {
        ...
        <... $MUTEX.lock().unwrap_or_else(...) ...>;
        ...
      }
    message: "Potential deadlock: locking mutex twice in if/else. Simplify to single lock with unwrap_or_else. See BUGS_FIXED.md for example fix."
    languages: [rust]
    severity: ERROR
    metadata:
      category: reliability
      cwe: "CWE-667: Improper Locking"
    paths:
      include:
        - "**/eval/**"
        - "**/sync.rs"

  - id: variance-without-bessel
    pattern-either:
      - pattern: |
          let $VAR = $SCORES.iter().map(|$X| ($X - $MEAN).powi(2)).sum::<f64>() / $SCORES.len() as f64;
      - pattern: |
          let $VAR = $SCORES.iter().map(|&$X| ($X - $MEAN).powi(2)).sum::<f64>() / $SCORES.len() as f64;
    message: "Variance calculation uses population variance (n) instead of sample variance (n-1, Bessel's correction). For unbiased estimates, use (n-1). See BUGS_FIXED.md for details."
    languages: [rust]
    severity: ERROR
    metadata:
      category: correctness
      cwe: "CWE-682: Incorrect Calculation"
    paths:
      include:
        - "**/eval/**"

  - id: graph-node-empty-id
    pattern-either:
      - pattern: GraphNode::new("", $TYPE, $NAME)
      - pattern: GraphNode::new(String::new(), $TYPE, $NAME)
    message: "Graph node created with empty ID. Ensure IDs are non-empty and stable."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/graph.rs"

  - id: byte-indexing-on-text
    patterns:
      - pattern-either:
          - pattern: |
              &$TEXT[$START..$END]
          - pattern: |
              &$TEXT[..$END]
          - pattern: |
              &$TEXT[$START..]
      - metavariable-regex:
          metavariable: $TEXT
          regex: (?i)(^|[_\\.])(text|body|line|tag|url|uri|json|html|hash|pattern|remaining|trimmed)($|[_\\.])
    message: "Using byte indexing on text. For Unicode correctness, use character offsets or TextSpan. If byte indexing is intentional, add a comment."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/entity.rs"
        - "**/eval/**"
        - "**/backends/**"
      exclude:
        - "**/offset.rs"  # offset.rs handles conversions
