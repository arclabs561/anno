name: Public release counts
on:
  push:
    branches:
      - ci/public-release-counts-20261127-0315
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure public transcript and summary releases
        run: python3 scripts/release_ci/run.py
      - name: Save aggregate counts and source checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-release-counts
          path: public-release-counts.csv
          if-no-files-found: error
          retention-days: 30
