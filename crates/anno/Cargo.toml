[package]
name = "anno"
version = "0.13.0"
edition = "2021"
rust-version.workspace = true
description = "NER, coreference resolution, relation extraction, PII detection, and zero-shot entity types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/anno"
homepage = "https://github.com/arclabs561/anno"
documentation = "https://docs.rs/anno"
readme = "../../README.md"
keywords = ["ner", "nlp", "extraction", "coreference", "pii"]
categories = ["text-processing", "artificial-intelligence"]
include = [
  "/src/**/*.rs",
  # bundled-hmm-params / bundled-crf-weights include_str! these; an .rs-only
  # whitelist shipped 0.10.0 without them, breaking those features on crates.io
  "/src/backends/hmm_params.json",
  "/src/backends/crf_weights.json",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/LICENSE-*",
  "/README.md",
]

[lib]
name = "anno"

[dependencies]
textprep = { workspace = true }
schemars = { version = "1", features = ["derive"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
log = { workspace = true }
ureq = { workspace = true, optional = true }
dirs = { workspace = true }

# ML
# `ort`'s ndarray interop is feature-gated in newer releases.
ort = { workspace = true, features = ["ndarray"], optional = true }
ndarray = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
half = { workspace = true, optional = true }

# Semantic text chunking (optional).
text-splitter = { version = "0.32", optional = true }

# Graph/KG export (optional). Adapters from extraction output to `lattix::KnowledgeGraph`.
lattix = { version = "0.6", optional = true }

# Utilities
itertools = { workspace = true }
rayon = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Observability
tracing = { workspace = true, optional = true }

# The synchronous Hugging Face client owns a native filesystem cache and native
# HTTP stack. Browser builds receive model bytes from their JS host instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

# tokenizers defaults use Oniguruma, which builds a C library. The wasm
# implementation uses its Rust regex path instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["unstable_wasm"] }


[dev-dependencies]
deformat = { workspace = true }
proptest = { workspace = true }
tempfile = "3.27.0"
criterion = { workspace = true }

[features]
default = ["onnx", "heuristic-fr"]
heuristic-fr = []
# Metrics-only analysis helpers (preferred for research / diagnostics).
# Exposes `anno::metrics::*` (coref scoring metrics, cluster encoders).
analysis = []
discourse = []
schema = ["dep:schemars"]
# Graph/KG export surface. Exposes `anno::graph::*` (lattix-backed
# adapters from extraction output to KnowledgeGraph and N-Triples).
graph = ["dep:lattix"]
onnx = [
  "dep:ort",
  "dep:ndarray",
  "dep:tokenizers",
  "dep:hf-hub",
  "dep:lru",
  "dep:safetensors",
  "dep:sha2",
]
# Apple CoreML / Apple Neural Engine acceleration for ONNX backends.
# macOS only (the underlying ort/coreml feature requires macOS at link time).
# Set `OnnxSessionConfig::prefer_coreml = true` at session construction to
# require CoreML provider registration. Unsupported graph nodes can still
# execute on CPU after the provider registers successfully.
onnx-coreml = ["onnx", "ort/coreml"]
# NVIDIA CUDA acceleration for ONNX backends. Linux/Windows + nvcc/CUDA 12.x
# at link time. Set `OnnxSessionConfig::prefer_cuda = true` to attach the
# CUDA execution provider with registration required. Unsupported graph nodes
# can still execute on CPU. A build does not prove acceleration; validate with
# `examples/onnx_cuda_smoke.rs` on a real GPU host.
onnx-cuda = ["onnx", "ort/cuda"]
onnx-directml = ["onnx", "ort/directml"]
onnx-rocm = ["onnx", "ort/rocm"]
# fastino-ai GLiNER2 backend (issue #18). Loads a compatible pre-exported
# ONNX snapshot. WIP / experimental — no API stability guarantees. Implements
# Model + ZeroShotNER and an internal classify() method.
gliner2-fastino = ["onnx", "dep:half"]
gliner2-fastino-cuda    = ["gliner2-fastino", "onnx-cuda"]
gliner2-fastino-coreml  = ["gliner2-fastino", "onnx-coreml"]
# Phase 4: Candle backend with PEFT LoRA adapter merge-at-load.
# Uses candle-transformers::models::debertav2 for the encoder.
gliner2-fastino-candle       = ["gliner2-fastino", "candle", "dep:candle-transformers"]
gliner2-fastino-candle-cuda  = ["gliner2-fastino-candle", "candle-core/cuda", "candle-transformers/cuda"]
gliner2-fastino-candle-metal = ["gliner2-fastino-candle", "candle-core/metal", "candle-transformers/metal"]
candle = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:safetensors",
  "dep:tokenizers",
  "dep:hf-hub",
]
metal = ["candle", "candle-core/metal"]
cuda = ["candle", "candle-core/cuda"]
llm = ["dep:ureq"]
# Runtime-oriented infra toggles are intentionally collapsed to one feature to keep
# the public feature surface smaller and avoid "splintered" combinatorics.
production = ["dep:tracing"]

# Bundled classical assets (opt-in).
#
# These features exist to prevent model assets from being embedded into binaries unless the
# caller explicitly enables them. This keeps default builds minimal and avoids surprising
# redistribution of large artifacts.
bundled-crf-weights = []
bundled-hmm-params = []

# Optional integration with `text-splitter` for sentence/grapheme-aware chunking.
chunking = ["dep:text-splitter"]

# Optional data-parallel batch extraction via rayon. When enabled,
# `Model::par_extract_batch` runs backend calls on rayon's thread pool.
parallel = ["dep:rayon"]

[[bench]]
name = "backends"
harness = false

[[bench]]
name = "coref"
harness = false

[[bench]]
name = "gliner2_fastino_iobinding"
harness = false
required-features = ["gliner2-fastino"]

# The demo's whole body is behind `#![cfg(feature = "gliner2-fastino-candle")]`,
# so without the feature it has no `main` and `cargo check --all-targets`
# fails with E0601. Gate it the same way the iobinding bench is gated.
[[example]]
name = "gliner2_candle_lora_demo"
required-features = ["gliner2-fastino-candle"]

[package.metadata.docs.rs]
# Hardware-specific features are mutually platform-bound: in particular,
# `metal` pulls in `objc2`, which intentionally does not compile on docs.rs's
# Linux builder. Keep this list aligned with the docs job in ci.yml.
no-default-features = true
features = [
  "heuristic-fr",
  "analysis",
  "discourse",
  "schema",
  "graph",
  "onnx",
  "gliner2-fastino",
  "gliner2-fastino-candle",
  "candle",
  "llm",
  "production",
  "bundled-crf-weights",
  "bundled-hmm-params",
  "chunking",
  "parallel",
]
rustdoc-args = ["--cfg", "docsrs"]
