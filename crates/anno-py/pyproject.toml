[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "anno-py"
version = "0.1.0"
description = "Python bindings for anno"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[project.urls]
Repository = "https://github.com/arclabs561/anno"

[tool.maturin]
features = ["extension-module"]
module-name = "anno_py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]
