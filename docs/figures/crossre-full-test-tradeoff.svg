<title id="chart-title">Which extra CrossRE relations are worth reviewing?</title><desc id="chart-desc">Correct matches and unmatched predictions per 100 sentences. Each panel shares the correct and unmatched rate axes. The numbered points identify the exact counts and recall in its table. Identical counts share a point. Original test panel · gold missed by stock has 192 sentences and 435 gold items. Stock only has 0 correct, 0 unmatched, and 0.0% recall. Confidence has 20 correct, 140 unmatched, and 4.6% recall. Label margin has 24 correct, 136 unmatched, and 5.5% recall. Direction margin has 20 correct, 140 unmatched, and 4.6% recall. Both margins has 24 correct, 136 unmatched, and 5.5% recall. All above 0.40 has 23 correct, 206 unmatched, and 5.3% recall. Additional content-disjoint test texts · gold missed by stock has 2,047 sentences and 5,404 gold items. Stock only has 0 correct, 0 unmatched, and 0.0% recall. Confidence has 196 correct, 1,517 unmatched, and 3.6% recall. Label margin has 188 correct, 1,525 unmatched, and 3.5% recall. Direction margin has 198 correct, 1,515 unmatched, and 3.7% recall. Both margins has 194 correct, 1,519 unmatched, and 3.6% recall. All above 0.40 has 386 correct, 2,694 unmatched, and 7.1% recall. All official test occurrences · gold missed by stock has 2,446 sentences and 6,281 gold items. Stock only has 0 correct, 0 unmatched, and 0.0% recall. Confidence has 234 correct, 1,788 unmatched, and 3.7% recall. Label margin has 232 correct, 1,790 unmatched, and 3.7% recall. Direction margin has 236 correct, 1,786 unmatched, and 3.8% recall. Both margins has 238 correct, 1,784 unmatched, and 3.8% recall. All above 0.40 has 436 correct, 3,107 unmatched, and 6.9% recall.</desc>
