<title id="paired-title">What does BERT recover on news and filing text?</title><desc id="paired-desc">Baseline HeuristicNER compared with candidate FP32 BERT NER on the same inputs. Total suggestions include exact and unmatched predictions. CoNLL04RE. 288-case joint extraction test · entity layer · 288 source records. +359 net exact matches · 395 → 754. Gained 376 · lost 17. Retained 378 of 395 baseline matches (95.7%). Change in total suggestions is +6 (1,126 to 1,132). Change in unmatched is −353 (731 to 378). SECFilingsNER. SEC FIN3 · complete mirrored test file · 303 source records. −153 net exact matches · 218 → 65. Gained 22 · lost 175. Retained 43 of 218 baseline matches (19.7%). Change in total suggestions is −453 (1,166 to 713). Change in unmatched is −300 (948 to 648).</desc>
