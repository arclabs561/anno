<text x="18" y="221" class="score">+13 net exact matches · 16 → 29</text>
<text x="18" y="243" class="scope">Gained 16 · lost 3 · retained 13/16 (81.2%)</text>
<text x="18" y="263" class="measure">Total suggestions</text>
