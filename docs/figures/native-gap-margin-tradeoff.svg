<title id="chart-title">Choosing when to link a pronoun on GAP</title><desc id="chart-desc">Horizontal position counts predictions without a reference match. Rates are per 100 excerpts. Settings with identical counts share a mark. GAP test, supplied mentions has 2,000 excerpts and 1,773 gold items. Stock has 3 correct, 14 unmatched, and 17 total suggestions. Neutral type has 131 correct, 141 unmatched, and 272 total suggestions. Classified mentions has 142 correct, 218 unmatched, and 360 total suggestions. Rival 0.15 (dev choice) has 106 correct, 128 unmatched, and 234 total suggestions. Rival 0.1 has 128 correct, 138 unmatched, and 266 total suggestions. Rival 0.3 has 47 correct, 59 unmatched, and 106 total suggestions. Threshold 0.025 (dev choice) has 108 correct, 108 unmatched, and 216 total suggestions. Threshold 0.1 has 44 correct, 37 unmatched, and 81 total suggestions. Threshold 0.3 has 0 correct, 0 unmatched, and 0 total suggestions. </desc>
