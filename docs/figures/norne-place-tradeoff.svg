<svg xmlns="http://www.w3.org/2000/svg" width="560" height="883" viewBox="0 0 560 883" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">How many mislabeled places does a NorNE review find?</title><desc id="chart-desc">Horizontal position counts all suggestions sent to review. Rates are per 100 PER suggestions. Settings with identical counts share a mark. Bokmål test has 1,219 PER suggestions and 265 gold items. After i or fra has 106 correct, 68 unmatched, and 174 total suggestions. All PER suggestions has 265 correct, 954 unmatched, and 1,219 total suggestions. Nynorsk test has 945 PER suggestions and 182 gold items. After i or fra has 102 correct, 57 unmatched, and 159 total suggestions. All PER suggestions has 182 correct, 763 unmatched, and 945 total suggestions. </desc>
