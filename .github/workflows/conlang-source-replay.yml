name: Public dictionary source verification
on:
  push:
    branches: [eval/conlang-source-replay-20261127]
    paths: [.github/workflows/conlang-source-replay.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure pinned language-project releases
        shell: bash
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          import hashlib, json, re, urllib.request
          
          def run(item):
              key, url = item
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Anno public dataset inventory"})
                  with urllib.request.urlopen(req, timeout=40) as response:
                      b = response.read()
                      final_url = response.geturl()
                  result = {"source": key, "url": final_url, "bytes": len(b), "sha256": hashlib.sha256(b).hexdigest()}
                  if key in ("Dothraki", "HighValyrian"):
                      revision = json.loads(b)["query"]["pages"][0]["revisions"][0]
                      text = revision["slots"]["main"]["content"]
                      result.update(revid=revision["revid"], publisher_sha1=revision["sha1"], declared_size=revision["size"], content_bytes=len(text.encode()), content_sha1=hashlib.sha1(text.encode()).hexdigest(), content_sha256=hashlib.sha256(text.encode()).hexdigest())
                      if key == "Dothraki":
                          section = re.split(r"^==\s*Vocabulary List\s*==\s*$", text, flags=re.M)[1]
                          section = re.split(r"^==\s*Abbreviations\s*==\s*$", section, flags=re.M)[0]
                          tops=[line for line in section.splitlines() if re.match(r"^\*(?![:*#])", line)]
                          result.update(entries=len(tops), bold=sum(bool(re.match(r"^\*\s*'''\S", row)) for row in tops))
                      else:
                          rows = [row for row in text.splitlines() if row.strip()]
                          result.update(lines=len(rows), templates=sum(bool(re.fullmatch(r"\{\{hval-entry\|[^{}]+\}\}", row.strip())) for row in rows), unique=len(set(rows)))
                  elif key == "InterslavicCorpus":
                      data=json.loads(b)["wordList"]
                      cols=data[0]
                      result.update(headers=cols,rows=len(data)-1,shape=dict(Counter(map(len,data[1:]))))
                      for name in ("id","isv","en"):
                          if name in cols:
                              values=[str(row[cols.index(name)] or "").strip() for row in data[1:]]
                              result[name]={"nonempty":sum(bool(x) for x in values),"unique_nonempty":len(set(values)-{""})}
                  elif key == "Navi":
                      records=[r.split("\t") for r in b.decode("utf-8-sig").splitlines() if r.strip()]
                      result.update(rows=len(records),fields=dict(Counter(map(len,records))),header=[k[:36] for k in records[0]][:6])
                  else:
                      rows=[r for r in b.decode("latin1").splitlines() if r.strip()]
                      result.update(lines=len(rows), blank=len(b.decode("latin1").splitlines())-len(rows),
                                    unique_leading_fields=len({r.split()[0] for r in rows}))
                  return result
              except Exception as exc:
                  return {"source":key,"error":str(exc)}
          wiki="https://wiki.languageinvention.com/api.php?action=query&format=json&formatversion=2&prop=revisions&rvslots=main&rvprop=ids%7Csha1%7Csize%7Ccontent&revids="
          sources={"Dothraki":wiki+"1214223","HighValyrian":wiki+"1310494","InterslavicCorpus":"https://raw.githubusercontent.com/sonic16x/interslavic/6d8dad7922a7b2c379d8944f521c08d8f689734a/data/basic.json","Navi":"https://tirea.learnnavi.org/dictionarydata/NaviDictionary_en.tsv","Lojban/gismu":"https://www.lojban.org/static/publications/wordlists/gismu.txt","Lojban/cmavo":"https://www.lojban.org/static/publications/wordlists/cmavo.txt"}
          with ThreadPoolExecutor(max_workers=6) as pool:
              for row in pool.map(run,sources.items()):
                  print(json.dumps(row,ensure_ascii=True,sort_keys=True),flush=True)
          PY
