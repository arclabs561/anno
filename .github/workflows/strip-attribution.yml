name: strip-attribution

# Removes AI attribution footers and session links from pull request
# descriptions and reviews (.github/scripts/strip_attribution.py). Run it by hand to
# sweep every pull request. pull_request_target runs the script from main and
# never checks out pull request code, which is what makes its write token safe.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Strip attribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/strip_attribution.py
