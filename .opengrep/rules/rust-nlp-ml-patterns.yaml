# OpenGrep rules for NLP/ML-specific patterns in anno
# These catch common issues in NLP, ML inference, and evaluation code

rules:
  # ============================================================================
  # Text Offset and Span Validation
  # ============================================================================
  
  - id: entity-creation-without-validation
    pattern: |
      Entity::new($TEXT, $TYPE, $OFFSET, $OFFSET, $CONF)
    message: "Entity starts and ends at the same offset. Check the source span."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/backends/**"
        - "**/eval/**"
      exclude:
        - "**/entity.rs"  # Entity::new may have validation

  - id: entity-created-without-validation
    pattern: |
      let $ENTITY = Entity::new(...);
      $OUT.push($ENTITY);
    message: "A newly constructed entity is pushed directly into the output. Check where its source offsets are validated."
    languages: [rust]
    severity: INFO
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/**"
        - "**/backends/**"
      exclude:
        - "**/tests/**"

  - id: span-overlap-calculation
    patterns:
      - pattern: |
          fn $F(...) -> f64 { $NUM / $DENOM }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*overlap.*
    message: "This overlap calculation directly divides by the denominator. Verify the zero-denominator case."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/metrics.rs"
        - "**/eval/**"

  # ============================================================================
  # ML Model Loading and Error Handling
  # ============================================================================
  
  - id: model-download-without-error-context
    pattern: |
      let $MODEL = $REPO.get($PATH).map_err(|$E| Error::Retrieval(format!("Failed: {}", $E)))?;
    message: "Model retrieval reports only the error. Include the requested model or asset in the diagnostic."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/**"

  - id: hf-authentication-check
    pattern: |
      let $REPO = $API.model($MODEL_ID);
      let $FILE = $REPO.get($PATH).map_err(|$E| Error::Retrieval($E.to_string()))?;
    message: "Hub retrieval forwards only the error text. Consider whether authentication failures need context."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/w2ner.rs"
        - "**/backends/nuner.rs"
        - "**/backends/gliner*.rs"

  - id: onnx-session-without-error-context
    pattern-either:
      - pattern: |
          Session::builder().commit_from_file($PATH).map_err(|$E| Error::Retrieval($E.to_string()))?
      - pattern: |
          Session::builder().commit_from_file($PATH).map_err(|$E| Error::Retrieval(format!("{}", $E)))?
    message: "ONNX session loading forwards only the error text. Include the model path."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/**onnx*.rs"
        - "**/session_pool.rs"

  # ============================================================================
  # Evaluation Framework Patterns
  # ============================================================================
  
  - id: confidence-interval-variance-calculation
    pattern: |
      let variance = $SCORES.iter().map(|&$X| ($X - $MEAN).powi(2)).sum::<f64>() / $SCORES.len() as f64;
    message: "This confidence-interval calculation uses population variance. Verify that the sample variance is intended."
    languages: [rust]
    severity: ERROR
    metadata:
      category: correctness
      cwe: "CWE-682: Incorrect Calculation"
    paths:
      include:
        - "**/eval/task_evaluator.rs"
        - "**/eval/metrics.rs"

  - id: per-example-cache-clone-in-loop
    pattern: |
      for $ITEM in $ITER {
          ...
          let $CACHE = $CACHE_MUTEX.lock().unwrap().clone();
          ...
      }
    message: "Cloning cache in loop. Consider cloning once before loop or using Arc for shared access."
    languages: [rust]
    severity: WARNING
    metadata:
      category: performance
    paths:
      include:
        - "**/eval/task_evaluator.rs"

  - id: backend-factory-mismatch
    pattern: |
      let $BACKEND = BackendFactory::create("coref_resolver")?;
      ...
      $BACKEND.extract_entities(...);
    message: "The coreference backend is asked for entity extraction. Verify its task capability."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/task_evaluator.rs"
        - "**/eval/backend_factory.rs"

  # Backend Send/Sync bounds are checked by Rust. The feature attribute alone
  # says nothing about how an instance is shared between threads.

  # ============================================================================
  # Confidence Score Validation
  # ============================================================================

  - id: f1-precision-recall-validation
    patterns:
      - pattern: |
          let $METRIC = $TP / ($TP + $FP);
      - pattern-not-inside: |
          if $TP + $FP == 0 { return ...; }
          ...
          let $METRIC = $TP / ($TP + $FP);
    message: "Check the zero denominator in this precision or recall calculation."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/metrics.rs"
        - "**/eval/ner_metrics.rs"

  # ============================================================================
  # Session Pool and Resource Management
  # ============================================================================
  
  - id: session-pool-acquire-without-release
    pattern: |
      let $SESSION = $POOL.acquire()?;
      ...
      std::mem::forget($SESSION);
    message: "Forgetting an acquired session prevents its guard from releasing the resource."
    languages: [rust]
    severity: WARNING
    metadata:
      category: resource-management
    paths:
      include:
        - "**/session_pool.rs"
        - "**/backends/**"

  - id: onnx-session-reuse-check
    pattern: |
      for $ITEM in $ITER {
          ...
          let $SESSION = Session::builder().commit_from_file($PATH)?;
          ...
      }
    message: "An ONNX session is constructed inside the loop. Check whether the model can be loaded once."
    languages: [rust]
    severity: INFO
    metadata:
      category: performance
    paths:
      include:
        - "**/backends/**onnx*.rs"

  # ============================================================================
  # Tokenization and Encoding
  # ============================================================================
  
  - id: tokenizer-load-without-error-context
    pattern-either:
      - pattern: |
          Tokenizer::from_file($PATH).map_err(|$E| Error::Retrieval($E.to_string()))?
      - pattern: |
          Tokenizer::from_file($PATH).map_err(|$E| Error::Retrieval(format!("{}", $E)))?
    message: "Tokenizer loading forwards only the error text. Include the tokenizer path."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/backends/**"

  - id: encoding-overflow-check
    pattern: |
      let $ENCODED = $TOKENIZER.encode($TEXT, ...)?;
      let $IDS = $ENCODED.get_ids();
      $MODEL.run($IDS)?;
    message: "Encoded token IDs are passed directly to the model. Verify the maximum sequence length."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/backends/**"

  # ============================================================================
  # Dataset Loading and Parsing
  # ============================================================================
  
  - id: dataset-load-without-empty-check
    pattern: |
      let $DATASET = load_dataset($ID)?;
      $DATASET[0]
    message: "A just-loaded dataset is indexed at zero. Handle an empty dataset."
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
    paths:
      include:
        - "**/eval/loader.rs"
        - "**/eval/datasets.rs"

  - id: json-parsing-without-error-context
    pattern-either:
      - pattern: |
          serde_json::from_str($JSON).map_err(|$E| Error::Parse($E.to_string()))?
      - pattern: |
          serde_json::from_str($JSON).map_err(|$E| Error::Parse(format!("{}", $E)))?
    message: "JSON parsing forwards only the error text. Add the source identifier or record number."
    languages: [rust]
    severity: INFO
    metadata:
      category: developer-experience
    paths:
      include:
        - "**/eval/loader.rs"

